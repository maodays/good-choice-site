<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Good Choice</title>
  <meta name="description" content="Good Choice — 幫您輕鬆做出選擇。">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(155deg,#acd9ff,#e5f5ff 54%,#fff3ba);color:#17315d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.card{text-align:center;width:min(520px,100%);padding:52px 28px;border-radius:36px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 60px rgba(27,79,216,.14);backdrop-filter:blur(18px)}img{width:92px;height:92px;border-radius:28px;box-shadow:0 12px 34px rgba(27,79,216,.16)}h1{font-size:clamp(32px,8vw,52px);font-weight:300;letter-spacing:.18em;margin:24px 0 8px}p{font-size:16px;letter-spacing:.08em;color:#64748b}a{display:inline-block;margin-top:28px;padding:14px 24px;border-radius:999px;background:#1b4fd8;color:white;text-decoration:none;font-weight:600;letter-spacing:.08em}
  </style>
</head>
<body><main class="card"><img src="logo.png" alt="Good Choice App Logo"><h1>GOOD CHOICE</h1><p>讓每一次猶豫，都有一個輕鬆的答案。</p><a href="privacy/">隱私權政策</a></main></body>
</html>
